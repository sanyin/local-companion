<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="local-companion architecture: everything runs on your machine">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b80"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5566"/>
    </marker>
  </defs>

  <rect width="1100" height="540" fill="#0e1116"/>

  <text x="44" y="46" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">local-companion</text>
  <text x="44" y="71" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">memory, boundaries, and a heartbeat — nothing leaves this box</text>

  <!-- machine boundary -->
  <rect x="28" y="96" width="844" height="392" rx="14" fill="#12161d" stroke="#2b323c" stroke-dasharray="6 5"/>
  <text x="856" y="116" fill="#6b7787" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="end" letter-spacing="0.5">YOUR MACHINE</text>

  <!-- client -->
  <rect x="56" y="128" width="204" height="66" rx="10" fill="#1a2029" stroke="#39424e"/>
  <text x="72" y="154" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">pet.py · web UI</text>
  <text x="72" y="174" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">desktop ball · SSE</text>

  <line x1="260" y1="161" x2="316" y2="161" stroke="#5b6b80" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- core -->
  <rect x="320" y="120" width="300" height="80" rx="10" fill="#1b2433" stroke="#3f6ea8"/>
  <text x="336" y="148" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">core.py</text>
  <text x="336" y="169" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">state → prompt → tools → stream</text>
  <text x="336" y="187" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">every claim gets a citation or says it has none</text>

  <!-- fan-out to three columns -->
  <path d="M 372 200 V 226 H 178 V 250" fill="none" stroke="#5b6b80" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 470 200 V 226 H 455 V 250" fill="none" stroke="#5b6b80" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 568 200 V 226 H 724 V 250" fill="none" stroke="#5b6b80" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- memory -->
  <rect x="56" y="252" width="246" height="172" rx="10" fill="#171d26" stroke="#2f3946"/>
  <text x="72" y="276" fill="#7f8b9c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.2">MEMORY</text>
  <text x="72" y="302" fill="#dfe6ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5">memdb — SQLite + 2-gram FTS</text>
  <text x="72" y="324" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">memrank — hybrid score, 12 / 700</text>
  <text x="72" y="346" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">memlinks — edges, merge, cool</text>
  <text x="72" y="376" fill="#6f7b8b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">candidates wait for your yes</text>
  <text x="72" y="394" fill="#6f7b8b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">noisy ones fade, nothing is deleted</text>

  <!-- agency -->
  <rect x="332" y="252" width="246" height="172" rx="10" fill="#171d26" stroke="#2f3946"/>
  <text x="348" y="276" fill="#7f8b9c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.2">AGENCY · DEFAULT: OBSERVE</text>
  <text x="348" y="302" fill="#dfe6ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5">goals — goal + checkable predicate</text>
  <text x="348" y="324" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">gap — expected vs observed</text>
  <text x="348" y="346" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">agency — A0 … A5 ladder</text>
  <text x="348" y="368" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">predictions — calibration</text>
  <text x="348" y="390" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">ticker — 5 min heartbeat</text>

  <!-- world -->
  <rect x="604" y="252" width="240" height="172" rx="10" fill="#171d26" stroke="#2f3946"/>
  <text x="620" y="276" fill="#7f8b9c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.2">WORLD</text>
  <text x="620" y="302" fill="#dfe6ee" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5">tools — confirm gate</text>
  <text x="620" y="324" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">web — weather · news</text>
  <text x="620" y="346" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">desk — focused window</text>
  <text x="620" y="376" fill="#6f7b8b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">write and delete need a yes</text>

  <!-- outbound: the only path that leaves the machine -->
  <path d="M 848 337 H 898" fill="none" stroke="#4a5566" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-soft)"/>
  <rect x="902" y="300" width="172" height="74" rx="10" fill="#131820" stroke="#2b323c" stroke-dasharray="4 4"/>
  <text x="988" y="324" fill="#6f7b8b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle">only when you ask</text>
  <text x="988" y="347" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">weather · news · search</text>

  <!-- journal -->
  <line x1="179" y1="424" x2="179" y2="436" stroke="#4a5566" stroke-width="1.2"/>
  <line x1="455" y1="424" x2="455" y2="436" stroke="#4a5566" stroke-width="1.2"/>
  <rect x="56" y="436" width="788" height="38" rx="8" fill="#151a22" stroke="#2b323c"/>
  <text x="72" y="460" fill="#9aa4b2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">journal.jsonl — append-only ledger: remembered · confirmed · merged · cooled · decided</text>

  <text x="44" y="516" fill="#6b7787" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5">A5 (irreversible) never runs automatically. Default mode records decisions; it does not act on them.</text>
</svg>
